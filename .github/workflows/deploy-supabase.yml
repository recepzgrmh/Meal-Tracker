name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate database, then deploy functions
    if: vars.SUPABASE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.114.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply forward-only migrations
        run: supabase db push --linked

      # Only the two functions that are still the live implementation.
      #
      # analyze-meal, commit-meal and search-food-catalog moved to the Node
      # backend in `backend/`; their Deno copies are kept in the repository as
      # the pre-migration reference and have since diverged. A bare
      # `functions deploy` deploys every directory it finds, which would put
      # that stale fork back in front of users and silently undo the port.
      #
      # send-email must stay on Supabase because Supabase Auth calls it from
      # the internet; delete-account was out of scope for the port.
      - name: Deploy Edge Functions
        run: |
          supabase functions deploy send-email --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_ID"
