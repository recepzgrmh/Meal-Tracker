name: Paid live AI eval

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Evaluation slice
        required: true
        type: choice
        options:
          - bilingual_hybrid_v1.jsonl
          - photo_meals_v1.json
      max_cases:
        description: Maximum provider-backed cases (1-100)
        required: true
        default: '20'
        type: string
      confirm_cost:
        description: I accept the bounded OpenAI cost
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evaluate:
    name: Run authenticated live benchmark
    if: inputs.confirm_cost == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ai-evaluation
    env:
      EVAL_BACKEND_URL: ${{ secrets.EVAL_BACKEND_URL }}
      EVAL_SUPABASE_URL: ${{ secrets.EVAL_SUPABASE_URL }}
      EVAL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EVAL_SUPABASE_PUBLISHABLE_KEY }}
      EVAL_USER_JWT: ${{ secrets.EVAL_USER_JWT }}
      LIVE_EVAL_ACK: I_ACCEPT_PROVIDER_COST
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EVAL_GIT_REF: ${{ github.sha }}
      EVAL_MAX_CASES: ${{ inputs.max_cases }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run bounded live evaluation
        working-directory: backend
        # --persist: this is the only eval that costs money, so it is the
        # one whose result has to survive the run. Without it a comparison
        # between two commits needs someone to re-run it by hand.
        run: npm run eval:live -- "evals/gold/${{ inputs.dataset }}" --persist
