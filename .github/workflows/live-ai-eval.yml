name: Paid live AI eval

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Evaluation slice
        required: true
        type: choice
        options:
          - bilingual_hybrid_v1.jsonl
          - photo_meals_v1.json
      max_cases:
        description: Maximum provider-backed cases (1-100)
        required: true
        default: '20'
        type: string
      confirm_cost:
        description: I accept the bounded OpenAI cost
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  evaluate:
    name: Run authenticated live benchmark
    if: inputs.confirm_cost == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ai-evaluation
    env:
      EVAL_SUPABASE_URL: ${{ secrets.EVAL_SUPABASE_URL }}
      EVAL_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EVAL_SUPABASE_PUBLISHABLE_KEY }}
      EVAL_USER_JWT: ${{ secrets.EVAL_USER_JWT }}
      LIVE_EVAL_ACK: I_ACCEPT_PROVIDER_COST
      EVAL_MAX_CASES: ${{ inputs.max_cases }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.3
          cache: true

      - name: Run bounded live evaluation
        working-directory: supabase
        run: deno task eval:live "../evals/gold/${{ inputs.dataset }}"
